name: tzdata contents

on:
  push:
    branches:
      - master
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  tests:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["2.7", "3.10", "3.11", "pypy3.11", "3.12", "3.13", "3.14", "3.15t", "3.15"]
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        exclude:
          - python-version: "2.7"
        include:
          - python-version: "2.7"
            os: "ubuntu-latest"
            use-container: true
    env:
      TOXENV: py
    container:
      image: ${{ matrix.use-container && format('python:{0}', matrix.python-version) || '' }}  # zizmor: ignore[unpinned-images]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - if: ${{ !matrix.use-container }}
      name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }} (non-containers)
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade tox
    - name: Run tests
      run: |
        tox

  other:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        toxenv: ["precommit", "typing", "docs"]
    env:
      TOXENV: ${{ matrix.toxenv }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ${{ matrix.toxenv }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade tox
      - name: Run action
        run: |
          if [[ $TOXENV == "docs" ]]; then
            tox -- -j auto -bhtml -W -n -a --keep-going
          else
            tox
          fi
